name: Update Defold

on:
  workflow_dispatch:
  schedule:
    - cron: 0 */12 * * *

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: defold-bin
            channel: stable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check for updates
        id: check
        run: node scripts/update-defold.ts --pkg ${{ matrix.package.name }} --channel ${{ matrix.package.channel }}

      - if: steps.check.outputs.changed == 'true'
        uses: AsakuraMizu/pkgbuild-action@master
        with:
          path: ${{ matrix.package.name }}
          updpkgsums: true

      - if: steps.check.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v11
        with:
          add: ${{ matrix.package.name }}/PKGBUILD
          default_author: github_actions
          pull: --rebase --autostash
          message: '${{ matrix.package.name }}: update to ${{ steps.check.outputs.version }}'

  # Commits pushed with GITHUB_TOKEN do not trigger the push workflow.
  publish:
    needs: update
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      base: ${{ github.sha }}
    secrets: inherit
