name: Publish packages to AUR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated package names (empty for all)
        type: string
  workflow_call:
    inputs:
      base:
        description: Commit to diff main against when selecting packages
        type: string
        required: true

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Callers publish what they just committed to main.
          ref: ${{ inputs.base && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: detect
        env:
          BASE: ${{ inputs.base || github.event.before }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [[ -n $PACKAGES ]]; then
            read -ra candidates <<< "$PACKAGES"
          elif [[ -n $BASE && ! $BASE =~ ^0+$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            mapfile -t candidates < <(git diff --name-only "$BASE" HEAD | cut -d/ -s -f1 | sort -u)
          else
            candidates=(*/)
            candidates=("${candidates[@]%/}")
          fi
          packages=()
          for pkg in "${candidates[@]}"; do
            [[ -f $pkg/PKGBUILD ]] && packages+=("$pkg")
          done
          echo "packages=$(jq -cn '$ARGS.positional' --args "${packages[@]}")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}

    concurrency:
      group: publish-${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - id: pkgver
        run: echo pkgver=$(awk -F= '$1=="pkgver" { print $2 }' ${{ matrix.package }}/PKGBUILD) >> $GITHUB_OUTPUT

      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          asset_dir: ${{ matrix.package }}
          test: true
          # Refuse to push a version lower than the one already on the AUR.
          post_process: |
            srcinfo_version() {
              awk -F ' = ' '{ sub(/^\t/, "", $1) }
                $1 == "epoch" { e = $2 ":" } $1 == "pkgver" { v = $2 } $1 == "pkgrel" { r = $2 }
                END { print e v "-" r }'
            }
            if git cat-file -e HEAD:.SRCINFO 2>/dev/null; then
              old=$(git show HEAD:.SRCINFO | srcinfo_version)
              new=$(srcinfo_version < .SRCINFO)
              if (( $(vercmp "$new" "$old") < 0 )); then
                echo "::error::Refusing to downgrade from $old to $new"
                exit 1
              fi
            fi
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_PRIVATE_SSH_KEY }}
          commit_message: ${{ steps.pkgver.outputs.pkgver }}
